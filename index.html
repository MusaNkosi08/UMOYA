<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>UMOYA · African intelligence, understood.</title>
<style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#1C1C1C;background:#FAF6EE}*{box-sizing:border-box}body{margin:0;min-height:100vh}header{background:#FAF6EE;padding:24px 18px 18px;border-bottom:5px solid transparent;border-image:linear-gradient(135deg,#007A4D 0 12%,#FFB612 12% 24%,#DE3831 24% 36%,#007A4D 36% 48%,#FFB612 48% 60%,#DE3831 60% 72%,#007A4D 72% 84%,#FFB612 84%) 1}.brand{display:flex;align-items:center;justify-content:space-between;max-width:760px;margin:auto}.wordmark{font-size:1.75rem;font-weight:800;letter-spacing:.14em;color:#007A4D}.tagline{font-size:.8rem;margin:2px 0 0;color:#555}.status{font-size:.78rem;white-space:nowrap}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#007A4D;margin-right:5px}.offline .dot{background:#DE3831}.offline .status-text:after{content:"offline"}.offline .status-text{font-size:0}.offline .status-text:after{font-size:.78rem}main{max-width:760px;margin:auto;padding:20px 14px 96px}.modes{display:flex;gap:8px;overflow:auto;padding-bottom:18px}.mode{border:1px solid #007A4D;background:transparent;color:#007A4D;border-radius:18px;padding:8px 13px;font:inherit;font-size:.85rem;white-space:nowrap;cursor:pointer}.mode.active{background:#FFB612;color:#1C1C1C;border-color:#FFB612}.empty{text-align:center;padding:35px 5px 25px}.empty h1{font-size:1.45rem;margin:0 0 8px}.empty p{color:#555;margin:0 0 22px}.examples{display:grid;gap:10px;text-align:left}.example{border:1px solid #d6cdbd;background:#fffdf9;border-radius:12px;padding:13px;color:#1C1C1C;font:inherit;cursor:pointer}.chat{display:flex;flex-direction:column;gap:13px}.bubble{max-width:90%;padding:12px 14px;border-radius:16px;line-height:1.45;white-space:pre-wrap}.user{align-self:flex-end;background:#007A4D;color:#fff;border-bottom-right-radius:4px}.assistant{align-self:flex-start;background:#fff;border:1px solid #e6dece;border-bottom-left-radius:4px}.detected{display:inline-block;background:#FFB612;border-radius:10px;padding:2px 8px;font-size:.75rem;font-weight:700;margin-bottom:7px;white-space:normal}.error{color:#DE3831;border-color:#DE3831}.composer{position:fixed;bottom:0;left:0;right:0;background:#FAF6EE;border-top:1px solid #e6dece;padding:10px 14px}.form{display:flex;gap:8px;max-width:760px;margin:auto}.form textarea{resize:none;flex:1;border:1px solid #b9b09f;border-radius:12px;padding:11px;font:inherit;min-height:46px;max-height:120px;background:#fff}.send{border:0;border-radius:12px;background:#007A4D;color:#fff;padding:0 16px;font-weight:700;font:inherit;cursor:pointer}.send:disabled{opacity:.55;cursor:wait}@media(min-width:600px){header{padding-left:28px;padding-right:28px}main{padding-left:24px;padding-right:24px}}
</style>
</head>
<body>
<header><div class="brand"><div><div class="wordmark">UMOYA</div><div class="tagline">African intelligence, understood.</div></div><div class="status"><span class="dot"></span><span class="status-text">online</span></div></div></header>
<main><nav class="modes" aria-label="Explanation style"><button class="mode" data-mode="simple">Simple</button><button class="mode" data-mode="student">Student</button><button class="mode" data-mode="professional">Professional</button><button class="mode active" data-mode="african">African example</button></nav><section id="empty" class="empty"><h1>What would you like to understand?</h1><p>Ask naturally — mix your languages.</p><div class="examples"><button class="example">Ndicela undichazele ukuba artificial intelligence yintoni, usebenzise umzekelo endiwaziyo.</button><button class="example">Explain photosynthesis in a simple way, please.</button></div></section><section id="chat" class="chat" aria-live="polite"></section></main>
<div class="composer"><form class="form" id="form"><textarea id="input" rows="1" placeholder="Ask UMOYA anything..." aria-label="Your question"></textarea><button class="send" id="send">Send</button></form></div>
<script>
const $=s=>document.querySelector(s),chat=$("#chat"),empty=$("#empty"),input=$("#input"),send=$("#send");let mode="african",messages=[];
document.querySelectorAll(".mode").forEach(b=>b.onclick=()=>{document.querySelector(".mode.active").classList.remove("active");b.classList.add("active");mode=b.dataset.mode});
document.querySelectorAll(".example").forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});
function safe(text){return text.replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function add(text,kind){const el=document.createElement("div");el.className="bubble "+kind;el.innerHTML=safe(text).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");chat.append(el);el.scrollIntoView({behavior:"smooth",block:"end"});return el}
async function ask(){const text=input.value.trim();if(!text||send.disabled)return;empty.hidden=true;add(text,"user");messages.push({role:"user",content:text});input.value="";send.disabled=true;send.textContent="UMOYA is thinking...";try{const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:messages.slice(-6),mode})});const d=await r.json();if(!r.ok)throw Error(d.error);messages.push({role:"assistant",content:d.reply});const lines=(d.reply||"").split("\n"),first=lines[0].match(/^DETECTED:\s*(.*)$/);const el=add(first?lines.slice(1).join("\n"):d.reply,"assistant");if(first){const pill=document.createElement("span");pill.className="detected";pill.textContent="Detected: "+first[1];el.prepend(pill)}}catch(e){add(e.message||"Something went wrong. Please try again.","assistant error")}finally{send.disabled=false;send.textContent="Send"}}
$("#form").onsubmit=e=>{e.preventDefault();ask()};input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}};function online(){document.body.classList.toggle("offline",!navigator.onLine)}addEventListener("online",online);addEventListener("offline",online);online();
</script>
</body>
</html>
